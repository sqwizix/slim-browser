[package]
name = "slimbrowser-rust"
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "SlimBrowser for Windows: Rust application and system WebView2"

[dependencies]
anyhow = "1"
base64 = "0.23"
sha2 = "0.10"
adblock = "=0.13.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json", "socks"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
zeroize = { version = "1", features = ["derive"] }
tao = "0.34"
wry = { version = "=0.57.1", default-features = false, features = ["os-webview"] }
webview2-com = "0.39"
windows = { version = "0.62", features = ["Foundation", "UI_ViewManagement", "ApplicationModel_DataTransfer", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Com", "Win32_System_WinRT", "Win32_System_Com_StructuredStorage", "Win32_UI_Input_KeyboardAndMouse"] }
rfd = { version = "0.15", default-features = false }
clipboard-win = "5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
