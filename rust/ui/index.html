<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; form-action 'none'; base-uri 'none'; connect-src 'none'">
<title>Slim Browser</title><style>/*__STYLE__*/</style></head>
<body><div id="app">
<header id="titlebar"><div class="traffic"><button class="dot red" aria-label="Закрыть окно" data-cmd="close_window"></button><button class="dot yellow" aria-label="Развернуть или восстановить" data-cmd="maximize"></button><button class="dot green" aria-label="Свернуть окно" data-cmd="minimize"></button></div><button id="sidebar-reveal" class="icon-button" aria-label="Показать боковую панель" data-icon="sidebar" data-cmd="toggle_sidebar"></button><div id="drag-region"><span id="status" role="status" aria-live="polite"></span></div></header>
<div id="toolbar"><button class="icon-button" id="sidebar-toggle" aria-label="Боковая панель" data-icon="sidebar" data-cmd="toggle_sidebar"></button><button class="icon-button" id="back" aria-label="Назад" data-icon="back" data-cmd="back"></button><button class="icon-button" id="forward" aria-label="Вперёд" data-icon="forward" data-cmd="forward"></button><button class="icon-button" id="reload" aria-label="Обновить страницу" data-icon="reload" data-cmd="reload"></button><form id="address-form" class="address-shell"><input id="address" autocomplete="off" spellcheck="false" aria-label="Адрес сайта или поиск Google" placeholder="Адрес сайта или поиск Google"><div class="address-tools"><button type="button" class="icon-button" id="translate-toggle" aria-label="Перевести страницу — Google" data-icon="translate" data-cmd="translate_menu"></button><button type="button" class="icon-button" id="page-actions" aria-label="Действия со страницей и расширения" data-icon="pageTools" data-cmd="page_actions"></button></div></form><button class="icon-button" id="menu-toggle" aria-label="Меню" data-icon="more" data-cmd="toggle_menu"></button></div>
<aside id="sidebar"><div id="sidebar-scroll"><div id="folders"></div><button id="new-tab" class="new-tab" aria-label="Новая вкладка" data-cmd="new_tab"><span data-icon="plus"></span><span class="new-tab-label">Новая вкладка</span></button><div id="tabs" role="tablist" aria-label="Вкладки" aria-orientation="vertical"></div></div><footer id="sidebar-footer"><button id="sidebar-downloads" class="icon-button" aria-label="Загрузки" data-icon="download" data-cmd="downloads"><span id="download-count"></span></button><button id="sidebar-add" class="icon-button" aria-label="Добавить вкладку или папку" data-icon="plus" data-cmd="organize"></button></footer></aside>
<div id="sidebar-resizer" role="separator" tabindex="0" aria-label="Ширина боковой панели" aria-orientation="vertical" aria-valuemin="64" aria-valuemax="480" aria-valuenow="222"></div><main id="workspace"><div id="home"><form id="home-form" class="home-search"><input id="home-input" autocomplete="off" spellcheck="false" placeholder="Поиск или адрес сайта" aria-label="Поиск или адрес сайта"><button class="icon-button" type="submit" aria-label="Перейти" data-icon="forward"></button></form></div><section id="view" hidden></section></main>
<div id="resize-edges" aria-hidden="true"></div></div><nav id="popup-menu" aria-label="Меню браузера" hidden></nav>
<script>/*__SCRIPT__*/</script></body></html>
